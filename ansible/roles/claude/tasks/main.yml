---
- name: Check if claude is already installed (native)
  ansible.builtin.command:
    cmd: claude --version
  register: claude_existing
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.HOME }}/.claude/bin:{{ ansible_env.PATH }}"
 
- name: Install claude
  become: true
  become_user: "{{ machine_user }}"
  # curl -fsSL https://claude.ai/install.sh
  script: "files/claude-install.sh"
  when: claude_existing.rc != 0
  register: native_install_result
  changed_when: native_install_result.rc == 0
 
