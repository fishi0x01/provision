---
gondolin:
  # QEMU is the default (and recommended) VM backend. cpio/lz4/e2fsprogs are
  # only needed by `gondolin build` to assemble the initramfs and rootfs.
  # https://earendil-works.github.io/gondolin/custom-images/
  rpm_packages:
  - qemu-system-x86-core
  - qemu-img
  - cpio
  - lz4
  - e2fsprogs
  npm_package: "@earendil-works/gondolin"
  # The stock alpine-base guest image is deliberately minimal - no git, no
  # ripgrep, no compiler. Gondolin has no package layering, so extra tooling
  # means building our own image.
  # https://earendil-works.github.io/gondolin/limitations/
  image:
    tag: "pi-dev:latest"
    dir: ".local/share/gondolin/images/pi-dev"
