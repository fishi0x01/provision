---
- name: Create /nix directory owned by machine_user
  become: true
  ansible.builtin.file:
    path: /nix
    state: directory
    mode: "0755"
    owner: "{{ machine_user }}"
    group: "{{ machine_user }}"

- name: Install nix
  become: true
  become_user: "{{ machine_user }}"
  # https://nixos.org/download/
  ansible.builtin.script: "files/install-nix-{{ nix.version }}.sh --no-daemon"
  args:
    creates: "/nix/store"

- name: Make sure nix config dir exists
  ansible.builtin.file:
    path: "/home/{{ machine_user }}/.config/nix"
    owner: "{{ machine_user }}"
    group: "{{ machine_user }}"
    state: directory

- name: Configure nix (enable flakes)
  ansible.builtin.copy:
    src: "{{ role_path }}/files/nix.conf"
    dest: "/home/{{ machine_user }}/.config/nix/nix.conf"
    owner: "{{ machine_user }}"
    group: "{{ machine_user }}"
